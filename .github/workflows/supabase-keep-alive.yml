name: Supabase keep-alive

# Backup pinger for the Supabase free-tier auto-pause (7 days with no API
# activity). The primary pinger is Vercel Cron (web/vercel.json ->
# /api/cron/keep-alive), which runs daily; this runs independently on its
# own schedule so a Vercel Cron outage/misconfiguration alone can't let the
# project pause. Every 3 days leaves a wide margin under the 7-day limit
# even if one run fails.
on:
  schedule:
    - cron: '0 4 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: web
        run: npm install @supabase/supabase-js --no-save
      - name: Ping Supabase
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/keep-alive.mjs
